<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment History</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/theme-plus.css" />
    <link rel="stylesheet" href="../../css/booking-payment-theme.css" />
</head>
<body data-root="../..">
<div id="siteHeader"></div>

<div class="bp-shell">
    <div class="bp-card">
        <h2>My Payment History</h2>

        <div class="bp-search-row">
            <input type="text" id="paymentSearchInput" placeholder="Search by payment ID or movie" />
            <select id="paymentStatusFilter">
                <option value="">All Status</option>
                <option value="PENDING">Pending</option>
                <option value="COMPLETED">Completed</option>
                <option value="REFUND_PENDING">Refund Pending</option>
                <option value="REFUNDED">Refunded</option>
            </select>
        </div>

        <div id="paymentHistoryMessage"></div>
    </div>

    <div id="paymentHistoryGrid" class="bp-history-grid"></div>
</div>

<div id="siteFooter"></div>

<script src="../../js/config.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/payment-history.js"></script>
</body>
</html>
