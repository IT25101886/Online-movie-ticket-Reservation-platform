<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User List</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/theme-plus.css" />
</head>
<body data-root="../..">
<div id="siteHeader"></div>

<div class="app-shell">
    <div id="siteSidebar"></div>

    <main class="page-main">
        <div class="container">
            <div class="summary-card">
                <div class="summary-left">
                    <div class="summary-icon">👤</div>
                    <div>
                        <div class="summary-title">Total Users</div>
                        <div class="summary-number" id="totalUsersCount">0</div>
                    </div>
                </div>

                <div class="summary-actions">
                    <button id="loadAllBtn" class="btn" type="button">Refresh</button>
                </div>
            </div>

            <div class="management-card">
                <div class="management-header">
                    <h2>User Management</h2>
                </div>

                <div class="management-filters">
                    <form id="searchUsernameForm" class="search-inline-form">
                        <input type="text" id="searchUsername" placeholder="Search by username" />
                        <button type="submit">Search</button>
                    </form>

                    <form id="searchIdForm" class="search-inline-form">
                        <input type="number" id="searchUserId" placeholder="Search by user ID" />
                        <button type="submit">Find ID</button>
                    </form>
                </div>

                <div id="message"></div>

                <div class="table-wrapper clean-table">
                    <table>
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Active</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- User Details Modal -->
<div id="userDetailsModal" class="custom-modal hidden">
    <div class="custom-modal-overlay" id="closeUserModalOverlay"></div>

    <div class="custom-modal-content">
        <div class="custom-modal-header">
            <h2>User Details</h2>
            <button id="closeUserModalBtn" class="icon-close-btn" type="button">×</button>
        </div>

        <div class="custom-modal-body">
            <div class="user-detail-top">
                <img id="detailUserImage" class="user-detail-avatar" src="" alt="User" />
                <div>
                    <h3 id="detailFullName">Full Name</h3>
                    <p id="detailUsername" class="muted-text">@username</p>
                    <div id="detailRole" class="role-pill">REGULAR USER</div>
                </div>
            </div>

            <div class="details-table">
                <div class="detail-row">
                    <div class="detail-label">User ID</div>
                    <div class="detail-value" id="detailId"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Email</div>
                    <div class="detail-value" id="detailEmail"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Phone</div>
                    <div class="detail-value" id="detailPhone"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Role</div>
                    <div class="detail-value" id="detailRoleText"></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Status</div>
                    <div class="detail-value" id="detailStatus"></div>
                </div>
            </div>

            <div class="modal-actions">
                <button id="deactivateUserBtn" class="danger-btn" type="button">Deactivate User</button>
            </div>
        </div>
    </div>
</div>

<div id="siteFooter"></div>

<script src="../../js/config.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/users.js"></script>
</body>
</html>
