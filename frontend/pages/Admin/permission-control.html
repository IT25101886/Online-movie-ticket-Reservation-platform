<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permission Control</title>
    <link rel="stylesheet" href="../../css/style.css" />
</head>
<body data-root="../..">
<div id="siteHeader"></div>

<div class="app-shell">
    <div id="siteSidebar"></div>

    <main class="page-main">
        <div class="container">
            <div class="card">
                <h2>Change User Permission</h2>

                <form id="permissionForm">
                    <input type="number" id="targetUserId" placeholder="Target User ID" required />

                    <select id="accountType" required>
                        <option value="REGULAR">Regular User</option>
                        <option value="PREMIUM">Premium User</option>
                        <option value="ADMIN">Admin</option>
                    </select>

                    <select id="adminPermission">
                        <option value="USER_MANAGER">User Manager</option>
                        <option value="MOVIE_MANAGER">Movie Manager</option>
                        <option value="TICKET_MANAGER">Ticket Manager</option>
                        <option value="PAYMENT_MANAGER">Payment Manager</option>
                        <option value="REVIEW_MANAGER">Review Manager</option>
                        <option value="ADMIN_MANAGER">Admin Manager</option>
                    </select>

                    <button type="submit">Update Permission</button>
                </form>

                <div id="message"></div>
            </div>
        </div>
    </main>
</div>

<div id="siteFooter"></div>

<script src="../../js/config.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/permission-control.js"></script>
</body>
</html>
