<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make Payment</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/theme-plus.css" />
    <link rel="stylesheet" href="../../css/booking-payment-theme.css" />
</head>
<body data-root="../..">
<div id="siteHeader"></div>

<div class="bp-shell">
    <div class="bp-grid-2">
        <div class="bp-card">
            <h2>Make Payment</h2>

            <form id="paymentForm" class="bp-form-grid">
                <div class="full">
                    <label for="cardHolderName">Card Holder Name</label>
                    <input type="text" id="cardHolderName" placeholder="Card Holder Name" required />
                </div>

                <div class="full">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required />
                </div>

                <div>
                    <label for="expiryDate">Expiry Date</label>
                    <input type="text" id="expiryDate" placeholder="MM/YY" required />
                </div>

                <div>
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" placeholder="123" maxlength="4" required />
                </div>

                <div class="full bp-action-row">
                    <button type="submit">Process Payment</button>
                    <a class="secondary-btn" href="../booking/booking-history.html">Booking History</a>
                </div>
            </form>

            <div id="paymentMessage"></div>
        </div>

        <div class="bp-card">
            <h2>Booking Summary</h2>

            <div class="bp-summary-box">
                <div class="bp-summary-line">
                    <span>Booking ID</span>
                    <span id="payBookingId">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Movie</span>
                    <span id="payMovieTitle">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Date</span>
                    <span id="payDate">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Time</span>
                    <span id="payTime">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Seats</span>
                    <span id="paySeats">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Seat Type</span>
                    <span id="paySeatType">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Total</span>
                    <span id="payTotal" class="bp-total">Rs 0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="siteFooter"></div>

<script src="../../js/config.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/make-payment.js"></script>
</body>
</html>
