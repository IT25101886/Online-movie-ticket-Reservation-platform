<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Success</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/theme-plus.css" />
    <link rel="stylesheet" href="../../css/booking-payment-theme.css" />
</head>
<body data-root="../..">
<div id="siteHeader"></div>

<div class="bp-shell">
    <div class="bp-grid-2">
        <div class="bp-card">
            <h2>Payment Successful</h2>

            <div class="bp-summary-box">
                <div class="bp-summary-line">
                    <span>Payment ID</span>
                    <span id="successPaymentId">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Booking ID</span>
                    <span id="successBookingId">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Movie</span>
                    <span id="successMovieTitle">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Amount</span>
                    <span id="successAmount">-</span>
                </div>
                <div class="bp-summary-line">
                    <span>Status</span>
                    <span id="successStatus">COMPLETED</span>
                </div>
            </div>

            <div class="bp-action-row">
                <a class="btn" href="../booking/booking-history.html">View Booking History</a>
                <a class="secondary-btn" href="payment-history.html">View Payment History</a>
            </div>

            <div id="paymentSuccessMessage"></div>
        </div>

        <div class="bp-card">
            <h2>Secure Payment</h2>
            <div class="bp-summary-box">
                <div class="bp-summary-line"><span>SSL</span><span>Enabled</span></div>
                <div class="bp-summary-line"><span>PCI DSS</span><span>Compliant</span></div>
                <div class="bp-summary-line"><span>Fraud Detection</span><span>Enabled</span></div>
            </div>
        </div>
    </div>
</div>

<div id="siteFooter"></div>

<script src="../../js/config.js"></script>
<script src="../../js/layout.js"></script>
<script src="../../js/payment-success.js"></script>
</body>
</html>
